[package]
name = "fedora_theme_tailor"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = ["fs-all", "shell-all", "dialog-all", "process-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
color_eyre = "0.6"